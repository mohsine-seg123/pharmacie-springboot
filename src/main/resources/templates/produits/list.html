<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produits · Pharmacie</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav th:replace="~{fragments/navbar :: navbar}"></nav><main><h1>Produits</h1><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${error}" th:text="${error}"></p><a class="button" th:href="@{/produits/nouveau}">Ajouter un produit</a><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Prix</th><th>Code-barres</th><th>Expiration</th><th>Catégorie</th><th>Fournisseur</th><th>Actions</th></tr></thead><tbody><tr th:each="p : ${produits}"><td th:text="${p.nom}"></td><td th:text="${p.prix}"></td><td th:text="${p.codeBarre}"></td><td th:text="${p.dateExpiration}"></td><td th:text="${p.categorie.nom}"></td><td th:text="${p.fournisseur.nom}"></td><td class="actions"><a th:href="@{/produits/{id}(id=${p.id})}">Consulter</a><a th:href="@{/produits/{id}/modifier(id=${p.id})}">Modifier</a><form method="post" th:action="@{/produits/{id}/supprimer(id=${p.id})}" onsubmit="return confirm('Supprimer ce produit ?')"><button class="danger">Supprimer</button></form></td></tr><tr th:if="${#lists.isEmpty(produits)}"><td colspan="7">Aucun produit. Ajoutez d’abord une catégorie et un fournisseur.</td></tr></tbody></table></div></main></body></html>
