<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Détail du produit · Pharmacie</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav th:replace="~{fragments/navbar :: navbar}"></nav><main><h1>Détail du produit</h1><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${error}" th:text="${error}"></p><article><h2 th:text="${produit.nom}"></h2><dl><dt>Description</dt><dd th:text="${produit.description}"></dd><dt>Prix</dt><dd th:text="${produit.prix}"></dd><dt>Code-barres</dt><dd th:text="${produit.codeBarre}"></dd><dt>Expiration</dt><dd th:text="${produit.dateExpiration}"></dd><dt>Catégorie</dt><dd th:text="${produit.categorie.nom}"></dd><dt>Fournisseur</dt><dd th:text="${produit.fournisseur.nom}"></dd><dt>fabricant</dt><dd th:text="${produit.detailProduit.fabricant}"></dd><dt>paysOrigine</dt><dd th:text="${produit.detailProduit.paysOrigine}"></dd><dt>composition</dt><dd th:text="${produit.detailProduit.composition}"></dd><dt>dosage</dt><dd th:text="${produit.detailProduit.dosage}"></dd><dt>indications</dt><dd th:text="${produit.detailProduit.indications}"></dd><dt>Tags</dt><dd><span class="tag" th:each="t : ${produit.tags}" th:text="${t.libelle}"></span></dd></dl><a th:href="@{/produits/{id}/modifier(id=${produit.id})}">Modifier</a> · <a th:href="@{/produits}">Retour</a></article></main></body></html>
