<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enregistrer un produit · Pharmacie</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav th:replace="~{fragments/navbar :: navbar}"></nav><main><h1>Enregistrer un produit</h1><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${error}" th:text="${error}"></p><form class="editor" method="post" th:object="${produit}" th:action="${editId == null} ? @{/produits} : @{/produits/{id}(id=${editId})}"><ul class="error" th:if="${#fields.hasAnyErrors()}"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul>
<label>Nom<input type="text" th:field="*{nom}" required maxlength="255"></label><label>Description<input type="text" th:field="*{description}" maxlength="2000"></label><label>Prix<input type="number" th:field="*{prix}" required min="0" max="9999999999.99" step="0.01"></label><label>Code-barres<input type="text" th:field="*{codeBarre}" required maxlength="255"></label><label>Date d’expiration<input type="date" th:field="*{dateExpiration}" required></label>
<label>Catégorie<select th:field="*{categorie.id}" required><option value="">Choisir</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nom}"></option></select></label>
<label>Fournisseur<select th:field="*{fournisseur.id}" required><option value="">Choisir</option><option th:each="f : ${fournisseurs}" th:value="${f.id}" th:text="${f.nom}"></option></select></label>
<fieldset><legend>Tags</legend><label class="check" th:each="t : ${tags}"><input type="checkbox" name="tagIds" th:value="${t.id}" th:checked="${#lists.contains(selectedTags, t.id)}"><span th:text="${t.libelle}"></span></label><a th:href="@{/tags}">Gérer les tags</a></fieldset>
<fieldset><legend>Détails du médicament</legend><label>fabricant<input type="text" th:field="*{detailProduit.fabricant}" maxlength="255"></label><label>paysOrigine<input type="text" th:field="*{detailProduit.paysOrigine}" maxlength="255"></label><label>composition<input type="text" th:field="*{detailProduit.composition}" maxlength="2000"></label><label>dosage<input type="text" th:field="*{detailProduit.dosage}" maxlength="255"></label><label>indications<input type="text" th:field="*{detailProduit.indications}" maxlength="2000"></label></fieldset><button>Enregistrer</button> <a th:href="@{/produits}">Annuler</a></form></main></body></html>
