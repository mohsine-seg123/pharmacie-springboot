<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fournisseurs · Pharmacie</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><nav th:replace="~{fragments/navbar :: navbar}"></nav><main><h1>Fournisseurs</h1><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${error}" th:text="${error}"></p><div class="table-wrap"><table><thead><tr><th>nom</th><th>contact</th><th>adresse</th><th>Actions</th></tr></thead><tbody><tr th:each="i : ${items}"><td th:text="${i.nom}"></td><td th:text="${i.contact}"></td><td th:text="${i.adresse}"></td><td class="actions"><a th:href="@{/fournisseurs/{id}/modifier(id=${i.id})}">Modifier</a><form method="post" th:action="@{/fournisseurs/{id}/supprimer(id=${i.id})}" onsubmit="return confirm('Confirmer la suppression ?')"><button class="danger">Supprimer</button></form></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="4">Aucun enregistrement.</td></tr></tbody></table></div><h2 th:text="${editId == null ? 'Ajouter' : 'Modifier'}"></h2><form class="editor" method="post" th:object="${item}" th:action="${editId == null} ? @{/fournisseurs} : @{/fournisseurs/{id}(id=${editId})}"><ul class="error" th:if="${#fields.hasAnyErrors()}"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul><label>nom<input type="text" th:field="*{nom}" required maxlength="255"></label><label>contact<input type="text" th:field="*{contact}" maxlength="255"></label><label>adresse<input type="text" th:field="*{adresse}" maxlength="2000"></label><button>Enregistrer</button> <a th:href="@{/fournisseurs}">Annuler</a></form></main></body></html>
